<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title th:text="${product.id == null ? 'Add Product' : 'Edit Product'}">Product Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">RetailStock Pro</a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="/dashboard">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/products">Products</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4 mb-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header">
                        <h4 th:text="${product.id == null ? 'Add New Product' : 'Edit Product'}">Add Product</h4>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/products/save}" th:object="${product}" method="post">
                            <input type="hidden" th:field="*{id}" />

                            <div class="mb-3">
                                <label for="name" class="form-label">Product Name</label>
                                <input type="text" class="form-control" id="name" th:field="*{name}" required>
                            </div>

                            <div class="mb-3">
                                <label for="description" class="form-label">Description</label>
                                <textarea class="form-control" id="description" th:field="*{description}"
                                    rows="3"></textarea>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="price" class="form-label">Price (₹)</label>
                                    <input type="number" step="0.01" class="form-control" id="price" th:field="*{price}"
                                        required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="quantityInStock" class="form-label">Quantity</label>
                                    <input type="number" class="form-control" id="quantityInStock"
                                        th:field="*{quantityInStock}" required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="lowStockThreshold" class="form-label">Low Stock Threshold</label>
                                <input type="number" class="form-control" id="lowStockThreshold"
                                    th:field="*{lowStockThreshold}" required>
                                <div class="form-text">Alerts will trigger when stock drops at or below this level.
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="category" class="form-label">Category</label>
                                <select class="form-select" id="category" th:field="*{category}" required>
                                    <option value="">Select Category</option>
                                    <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}">
                                        Electronics</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label for="supplier" class="form-label">Supplier</label>
                                <select class="form-select" id="supplier" th:field="*{supplier}" required>
                                    <option value="">Select Supplier</option>
                                    <option th:each="sup : ${suppliers}" th:value="${sup.id}" th:text="${sup.name}">
                                        Supplier A</option>
                                </select>
                            </div>

                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary">Save Product</button>
                                <a href="/products" class="btn btn-outline-secondary">Cancel</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
